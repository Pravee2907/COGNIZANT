<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Community Event Gallery</title>

    <style>

        table{
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        td{
            padding: 15px;
        }

        .eventImage{
            width: 250px;
            height: 180px;
            border: 4px solid blue;
            border-radius: 10px;
        }

        caption{
            font-size: 28px;
            font-weight: bold;
            margin: 20px;
        }

        .eventTitle{
            font-weight: bold;
            color: darkblue;
        }

    </style>

</head>

<body>

    <table border="1">

        <caption>
            Community Events Gallery
        </caption>

        <tr>

            <td>
                <img 
                    src="https://via.placeholder.com/250x180"
                    alt="Tech Fest Event"
                    title="Tech Fest 2026"
                    class="eventImage"
                >

                <p class="eventTitle">
                    Tech Fest 2026
                </p>
            </td>

            <td>
                <img 
                    src="https://via.placeholder.com/250x180"
                    alt="Sports Day Event"
                    title="Sports Day"
                    class="eventImage"
                >

                <p class="eventTitle">
                    Annual Sports Day
                </p>
            </td>

            <td>
                <img 
                    src="https://via.placeholder.com/250x180"
                    alt="Cultural Event"
                    title="Cultural Fest"
                    class="eventImage"
                >

                <p class="eventTitle">
                    Cultural Fest
                </p>
            </td>

        </tr>

        <tr>

            <td>
                <img 
                    src="https://via.placeholder.com/250x180"
                    alt="Workshop Event"
                    title="AI Workshop"
                    class="eventImage"
                >

                <p class="eventTitle">
                    AI Workshop
                </p>
            </td>

            <td>
                <img 
                    src="https://via.placeholder.com/250x180"
                    alt="Seminar Event"
                    title="Seminar"
                    class="eventImage"
                >

                <p class="eventTitle">
                    Technical Seminar
                </p>
            </td>

            <td>
                <img 
                    src="https://via.placeholder.com/250x180"
                    alt="Volunteer Event"
                    title="Volunteer Program"
                    class="eventImage"
                >

                <p class="eventTitle">
                    Volunteer Program
                </p>
            </td>

        </tr>

    </table>

</body>

</html>
